name: Diagnose Meta lifecycle

on:
  push:
    branches:
      - diagnose/meta-lifecycle-hang
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: lifecycle-${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        source: [head, parent]
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-11
      - uses: Swatinem/rust-cache@v2
        with:
          key: lifecycle-${{ matrix.source }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - run: sudo apt-get update && sudo apt-get install -y mold protobuf-compiler gdb strace
      - name: Prepare identical dependency versions
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p diagnostics
          if [ "$SOURCE" = parent ]; then
            git diff 78cc768358d55ab08cab9c45f3feb8117fd6463e^ 78cc768358d55ab08cab9c45f3feb8117fd6463e --binary | git apply --reverse
          fi
          cp scripts/meta-lifecycle-Cargo.lock Cargo.lock
          cargo metadata --format-version 1 > /dev/null
          python3 - <<'PY'
          import pathlib, tomllib
          def packages(path):
              return {(p['name'], p['version'], p.get('source'), p.get('checksum'))
                      for p in tomllib.loads(pathlib.Path(path).read_text())['package']}
          expected = packages('scripts/meta-lifecycle-Cargo.lock')
          actual = packages('Cargo.lock')
          assert actual == expected, (actual - expected, expected - actual)
          PY
          cp Cargo.lock diagnostics/resolved-Cargo.lock
          { rustc -Vv; cargo -V; cargo nextest --version; uname -a; nproc; git diff --stat; } | tee diagnostics/environment.log
      - name: Reproduce original workspace workload
        id: workspace
        continue-on-error: true
        run: cargo nextest run --locked --workspace --no-fail-fast --failure-output immediate-final 2>&1 | tee diagnostics/workspace.log
      - name: Resolve the exact workspace test binary
        run: |
          cargo nextest list --locked --workspace --message-format json > diagnostics/nextest-list.json
          python3 - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path('diagnostics/nextest-list.json').read_text())
          suite = data['rust-suites']['databend-meta::it']
          pathlib.Path('diagnostics/binary-path.txt').write_text(suite['binary-path'])
          PY
      - name: Repeat the lifecycle test with native stack capture
        run: |
          python3 scripts/diagnose-meta-lifecycle.py "$(cat diagnostics/binary-path.txt)" \
            --count 500 --parallel 4 --timeout 50 --sudo-gdb \
            --continue-fast-failures --out diagnostics/repeated 2>&1 | tee diagnostics/repeated-summary.log
      - name: Check original suite outcome
        if: always() && steps.workspace.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-lifecycle-${{ matrix.source }}
          path: diagnostics/
          retention-days: 7
